name: Publish Manager release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release payload
        uses: actions/checkout@v4

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Forca Aliada Manager ${{ github.ref_name }}
          body: |
            ## Correcoes

            - Corrige convites remotos pela internet quando a sala do relay precisa ser recuperada.
            - Impede que um convite com App Key caia silenciosamente para endereco de rede local.
            - Rebaixa interfaces VPN/tunel na escolha de endereco LAN, evitando convites com NordLynx/OpenVPN.
            - Mantem fallback local apenas para configuracoes sem App Key.

            Testes de integracao, atualizacao, presenca, chat, sincronizacao e relay aprovados.
          generate_release_notes: false
          make_latest: true
          files: |
            payload/Forca-Aliada-Manager-Setup-*.exe
            payload/Forca-Aliada-Manager-Setup-*.exe.blockmap
            payload/latest.yml
          fail_on_unmatched_files: true
